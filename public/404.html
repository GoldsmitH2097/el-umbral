<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Soulware</title>
  <!-- Served with a real 404 status by the _redirects catch-all. Before this
       page existed, every unknown URL returned 200 + the SPA shell, so Google
       filed each one as "Alternate page with proper canonical tag" — an
       unbounded supply of phantom duplicates that no validation could ever
       clear. A genuine 404 ends that. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#020202" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020202; color: #c0c0c0;
      font-family: 'Times New Roman', serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 10vh 5vw; text-align: center;
    }
    .wrap { max-width: 560px; }
    .logo { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 64px; text-decoration: none; }
    .logo img { height: 32px; width: 32px; object-fit: contain; }
    .logo span { font-size: 14px; letter-spacing: 6px; text-transform: uppercase; color: #888; }
    .code { font-size: 13px; letter-spacing: 8px; color: #4a4a4a; text-transform: uppercase; margin-bottom: 22px; }
    h1 {
      font-size: clamp(22px, 4vw, 30px); font-weight: normal; letter-spacing: 5px;
      text-transform: uppercase; color: #e8ecef; margin-bottom: 28px; line-height: 1.5;
    }
    p { font-size: 14px; line-height: 2; color: #666; margin-bottom: 14px; }
    .links { margin-top: 56px; display: flex; gap: 34px; justify-content: center; flex-wrap: wrap; }
    .links a {
      font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
      color: #555; text-decoration: none; transition: color 0.3s;
    }
    .links a:hover { color: #e8ecef; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo">
      <img src="/assets/soulware-logo.webp" alt="Soulware" />
      <span>Soulware</span>
    </a>
    <p class="code">Error 404</p>
    <h1>Esta puerta no existe</h1>
    <p>La página que buscas no está aquí. Puede que nunca lo estuviera.</p>
    <div class="links">
      <a href="/">El Umbral</a>
      <a href="/obras/">Las Obras</a>
    </div>
  </div>
</body>
</html>
