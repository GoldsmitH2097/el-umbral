<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- E-reader with an open book — stroke-based so the line weight stays light
       and optically balanced against the shop wordmarks (Ruben 2026-08-01:
       the previous filled-path version read too heavy in the strip).
       Same 500×500 artboard convention as every other mark: the artboard IS
       the design — do not trim (see README.md in this folder). -->
  <g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- tablet body -->
    <rect x="118" y="72" width="264" height="356" rx="34" />
    <!-- home key -->
    <line x1="228" y1="392" x2="272" y2="392" />
    <!-- open book: spine -->
    <line x1="250" y1="150" x2="250" y2="330" />
    <!-- left page -->
    <path d="M250 162 C 224 142, 186 138, 162 148 L 162 316 C 186 306, 224 310, 250 330" />
    <!-- right page -->
    <path d="M250 162 C 276 142, 314 138, 338 148 L 338 316 C 314 306, 276 310, 250 330" />
    <!-- text lines, left -->
    <path d="M186 196 C 204 190, 220 191, 232 196" stroke-width="9" />
    <path d="M186 232 C 204 226, 220 227, 232 232" stroke-width="9" />
    <path d="M186 268 C 204 262, 220 263, 232 268" stroke-width="9" />
    <!-- text lines, right -->
    <path d="M268 196 C 280 191, 296 190, 314 196" stroke-width="9" />
    <path d="M268 232 C 280 227, 296 226, 314 232" stroke-width="9" />
    <path d="M268 268 C 280 263, 296 262, 314 268" stroke-width="9" />
  </g>
</svg>
