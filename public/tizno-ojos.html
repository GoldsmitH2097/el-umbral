<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tizno — hoja de expresiones (ojos)</title>
<style>
  :root { --ink: #0b0906; --eye-glow: #f39c12; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 70%, #1a1510 0%, #0b0906 55%, #050403 100%); color: #a89b86; font-family: 'Times New Roman', Times, serif; overflow: hidden; }
  #escena { position: fixed; inset: 0 0 110px 0; display: flex; align-items: center; justify-content: center; }
  /* El mismo ojo del rig (40×40, blanco, brillo, resplandor), escalado ×4 para verlo de cerca. */
  #rig { position: relative; width: 320px; height: 160px; transform: scale(var(--zoom, 4)); transform-origin: center; }
  .eye-wrapper { position: absolute; top: 60px; width: 40px; height: 40px;
    filter: drop-shadow(0 0 10px var(--eye-glow)) drop-shadow(0 0 20px var(--eye-glow)) drop-shadow(0 0 40px var(--eye-glow));
    --eye-x: 0px; --eye-y: 0px; --eye-sx: 1; --eye-sy: 1;
    transform: translate(var(--eye-x), var(--eye-y)) scale(var(--eye-sx), var(--eye-sy)); }
  #eye-left-wrapper { left: 100px; }
  #eye-right-wrapper { right: 100px; }
  /* El ojo (40×40) se dibuja dentro de una caja de 60×60 con 10px de margen:
     así los párpados pueden salirse del círculo (ojos como platos, cejas
     furiosas) sin que el borde de la caja los corte en recto. */
  .eye { position: absolute; left: -10px; top: -10px; width: 60px; height: 60px; background: #fff; clip-path: path('M 10,30 C 10,3.3 50,3.3 50,30 C 50,56.7 10,56.7 10,30 Z'); }
  /* El brillo: la falsa pupila (mismo sitio y tamaño que en el rig: 15%/20%/35% de 40px). */
  /* Sin brillo ni pupila (Ruben, 10-sep: «no me gusta el punto extraño»). */
  .eye::after { display: none; }
  /* LA CEJA: un trazo de hollín que solo existe cuando actúa. Es negra como el
     cuerpo y se lee en negativo contra el halo del ojo (como el pendiente). */
  .ceja { position: absolute; left: -4px; top: -14px; width: 48px; height: 11px; background: var(--ink);
    border-radius: 50% 50% 35% 35% / 100% 100% 40% 40%; opacity: var(--ceja-o, 0);
    transform: translate(var(--ceja-x, 0px), var(--ceja-y, 0px)) rotate(var(--ceja-r, 0deg)); transform-origin: 50% 100%; }

  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: linear-gradient(to top, rgba(5,4,3,0.95), rgba(5,4,3,0)); }
  #panel button { background: transparent; border: 1px solid rgba(200,146,42,0.5); color: #e8c87a; font: inherit; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; padding: 9px 14px; cursor: pointer; }
  #panel button:hover, #panel button.on { border-color: #e8c87a; color: #fff; background: rgba(200,146,42,0.14); }
  #panel .sep { width: 1px; height: 22px; background: rgba(200,146,42,0.3); margin: 0 6px; }
  #titulo { position: fixed; top: 18px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: #8c8c8c; }
  #titulo b { color: #c8922a; font-weight: normal; }
  #nombre { position: fixed; top: 46px; left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: #e8c87a; }
  #nota { position: fixed; top: 84px; left: 0; right: 0; text-align: center; font-size: 12px; color: #777; letter-spacing: 1px; }
  #zoom { position: fixed; top: 18px; right: 18px; font-size: 11px; color: #777; letter-spacing: 2px; }
  #zoom input { vertical-align: middle; accent-color: #c8922a; }
</style>
</head>
<body>
<div id="titulo">Tizno · <b>hoja de expresiones</b> · solo ojos, sin pupila ni brillo · cejas de hollín solo cuando actúan</div>
<div id="nombre">neutro</div>
<div id="nota">Pulsa una cara. «Hablar» simula las sílabas. «Auto» las recorre todas.</div>
<div id="zoom">ZOOM <input type="range" min="2" max="6" step="0.5" value="4" oninput="document.getElementById('rig').style.setProperty('--zoom', this.value)"></div>

<div id="escena">
  <div id="rig">
    <div class="eye-wrapper" id="eye-left-wrapper"><div class="ceja" id="ceja-left"></div><div class="eye left" id="eye-left"></div></div>
    <div class="eye-wrapper" id="eye-right-wrapper"><div class="ceja" id="ceja-right"></div><div class="eye right" id="eye-right"></div></div>
  </div>
</div>

<div id="panel"></div>

<script>
/* ── EL RIG DE OJOS ───────────────────────────────────────────────────────
   Cada ojo es el mismo disco blanco de siempre (40×40, brillo, resplandor).
   Lo que cambia es el recorte: dos párpados descritos como curvas. Sin
   pupila: el brillo hace de falsa pupila (tamaño y posición).

   Parámetros por ojo (todo en la caja de 40×40):
     top   0..1.2  altura del párpado superior (1 = arco de círculo, 0 = a media altura, <0 = por debajo)
     bot   -0.4..1.2  ídem párpado inferior (negativo = arco hacia ARRIBA → media luna ^)
     tIn   px  esquina INTERIOR (la que mira a la nariz) arriba (−) o abajo (+)
     tOut  px  esquina exterior
     sx sy  escala del ojo entero
     hl    escala del brillo (0 = sin brillo; 0.4 = pupila contraída de susto)
     hlx hly  desplazamiento del brillo (mirada)
     glow  color del resplandor
     trem  temblor (px)
   Cada parámetro viaja hacia su objetivo con un muelle; la rigidez la fija la
   pose (miedo y energía saltan; tristeza y susurro se deslizan). */
const CX = 30, K = 26.67, X0 = 10, X1 = 50; // caja 60×60: el círculo de 40 va de x=10 a x=50, centro y=30

/* Cejas: bY = altura (negativo = arriba), bR = giro en grados (positivo = el
   extremo INTERIOR baja: ceño), bO = visibilidad 0..1. */
const BASE = { top: 1, bot: 1, tIn: 0, tOut: 0, sx: 1, sy: 1, hl: 1, hlx: 0, hly: 0, trem: 0, bY: 0, bR: 0, bO: 0 };

// Poses. `L` y `R` sobreescriben por ojo (asimetría). `k` = rigidez del muelle.
const POSES = {
  neutro:   { k: 0.12, glow: '#f39c12', p: {} },
  miedo:    { k: 0.35, glow: '#dbe8ff', p: { top: 1.05, bot: 1.05, sx: 1.26, sy: 1.26, hl: 0.42, trem: 1.4, bY: -9, bO: 0.9 } },
  susurro:  { k: 0.08, glow: '#c98a2f', p: { top: 0, bot: 1, tIn: -5, tOut: -5, sx: 1.04, sy: 0.9, hl: 0 } },   // párpado de arriba PLANO, abajo redondo (Ruben)
  tristeza: { k: 0.06, glow: '#a97d2a', p: { top: 0.72, bot: 0.95, tIn: -3, tOut: 7, sy: 0.92, hl: 0.8, hly: 4, bY: -3, bR: -14, bO: 0.85 } },
  risa:     { k: 0.3,  glow: '#f5b642', p: { top: 1, bot: -0.55, sx: 1.04, sy: 1.0, hl: 0 } },   // media luna de dos circunferencias (Ruben)
  energia:  { k: 0.3,  glow: '#ffd36a', p: { top: 1.05, bot: 1.05, sx: 1.18, sy: 1.18, hl: 1.5 } },
  duda:     { k: 0.18, glow: '#f39c12', p: { hlx: 4, hly: -1 },
              L: { top: 1.05, bot: 1.05, sx: 1.16, sy: 1.16, bY: -9, bO: 1 },
              R: { top: 0.42, bot: 0.74, tIn: 4, tOut: -2, sx: 0.98, sy: 0.96, hl: 0.85, bY: 3, bR: 8, bO: 1 } },
  furia:    { k: 0.28, glow: '#ff7a2a', p: { top: 0, bot: 1, tIn: 10, tOut: -7, sy: 0.98, hl: 0, bY: 1, bR: 22, bO: 1 } },   // arriba RECTO en ángulo, abajo redondo (Ruben)
  // Gestos con ceja (Ruben, 10-sep): orgullo absurdo (doble ceja, Ace Ventura) y escucha (una arriba, otra abajo).
  orgullo:  { k: 0.4,  glow: '#f5b642', p: { top: 0.78, bot: 0.9, hlx: 3, hly: 1, bY: -8, bO: 1 } },
  escucha:  { k: 0.22, glow: '#f39c12', p: {},
              L: { top: 1.05, bot: 1.02, sx: 1.06, sy: 1.06, bY: -9, bR: -6, bO: 1 },
              R: { top: 0.7, bot: 0.9, tIn: 2, bY: 4, bR: 10, bO: 1 } },
};
// Gesto: secuencia de poses con tiempos (ms). Al acabar vuelve a la pose anterior.
const GESTOS = {
  orgullo: [['orgullo', 0], ['neutro', 170], ['orgullo', 340], ['neutro', 510], ['orgullo', 680], ['fin', 1400]],
  escucha: [['escucha', 0], ['fin', 2200]],
};
function gesto(nombre) {
  const prev = (pose in GESTOS) ? 'neutro' : pose;
  for (const [p, t] of GESTOS[nombre]) setTimeout(() => setPose(p === 'fin' ? prev : p), t);
}
const ORDEN = ['neutro', 'miedo', 'susurro', 'tristeza', 'risa', 'energia', 'duda', 'furia'];
const NOMBRES = { neutro: 'neutro', miedo: 'miedo · [scared]', susurro: 'susurro · [Whispers]', tristeza: 'tristeza · [Sighs]', risa: 'risa nerviosa · [Chuckles]', energia: 'emoción · [Excitedly]', duda: 'curiosidad · [Curious]', furia: 'furia · [Angrily]', orgullo: 'orgullo absurdo · doble ceja', escucha: 'escucha · una ceja arriba' };

// Estado vivo de cada ojo: valor actual (c) y velocidad (v) por parámetro.
function nuevoOjo() { const c = { ...BASE }, v = {}; for (const k in BASE) v[k] = 0; return { c, v }; }
const ojos = { L: nuevoOjo(), R: nuevoOjo() };
let pose = 'neutro', rigidez = 0.12, glowObj = '#f39c12';
let glowCur = { r: 243, g: 156, b: 18 };

function objetivo(lado) {
  const P = POSES[pose];
  return { ...BASE, ...(P.p || {}), ...(P[lado] || {}) };
}
function hex(c) { return { r: parseInt(c.slice(1, 3), 16), g: parseInt(c.slice(3, 5), 16), b: parseInt(c.slice(5, 7), 16) }; }

/* El recorte: párpado superior de la esquina exterior a la interior y párpado
   inferior de vuelta. Para el ojo izquierdo la esquina interior está a la
   derecha (x=40); para el derecho, a la izquierda (x=0). */
function recorte(lado, p) {
  const yIn = CX + p.tIn, yOut = CX + p.tOut;
  const [x0, y0, x1, y1] = lado === 'L' ? [X0, yOut, X1, yIn] : [X0, yIn, X1, yOut];
  const kt = K * p.top, kb = K * p.bot;
  return `path('M ${x0},${y0} C ${x0},${y0 - kt} ${x1},${y1 - kt} ${x1},${y1} C ${x1},${y1 + kb} ${x0},${y0 + kb} ${x0},${y0} Z')`;
}

const W = { L: document.getElementById('eye-left-wrapper'), R: document.getElementById('eye-right-wrapper') };
const E = { L: document.getElementById('eye-left'), R: document.getElementById('eye-right') };

// ── Voz simulada: sílabas como golpes (transient) sobre una envolvente. ──
let hablando = false, vol = 0, volFast = 0, proxSilaba = 0;
function voz(t, dt) {
  if (!hablando) { vol += (0 - vol) * 0.1; volFast += (0 - volFast) * 0.3; return 0; }
  if (t > proxSilaba) { volFast = 0.55 + Math.random() * 0.45; proxSilaba = t + 90 + Math.random() * 170; }
  volFast *= Math.pow(0.001, dt / 260);          // caída rápida
  vol += (volFast - vol) * 0.12;                 // envolvente lenta
  return Math.max(0, volFast - vol);             // el golpe seco de cada sílaba
}

// ── Parpadeo y temblor ──
let blinkT = { L: 900, R: 1500 }, blinking = { L: 0, R: 0 }, sinParpadeo = false;
window.__ojos = { setPose: (n) => setPose(n), quieto: (v) => { sinParpadeo = !!v; }, estado: () => ({ L: { ...ojos.L.c }, R: { ...ojos.R.c } }) };

let ultimo = performance.now(), auto = false, autoT = 0, autoIdx = 0;
function frame(t) {
  const dt = Math.min(50, t - ultimo); ultimo = t;
  const transient = voz(t, dt);

  if (auto && t > autoT) { autoIdx = (autoIdx + 1) % ORDEN.length; setPose(ORDEN[autoIdx]); autoT = t + 2200; }

  // resplandor: se desliza al color de la pose
  const g = hex(glowObj);
  glowCur.r += (g.r - glowCur.r) * 0.08; glowCur.g += (g.g - glowCur.g) * 0.08; glowCur.b += (g.b - glowCur.b) * 0.08;
  const glow = `rgb(${glowCur.r | 0},${glowCur.g | 0},${glowCur.b | 0})`;

  for (const lado of ['L', 'R']) {
    const o = ojos[lado], obj = objetivo(lado);
    for (const k in BASE) {                  // muelle con amortiguación
      const a = (obj[k] - o.c[k]) * rigidez;
      o.v[k] = (o.v[k] + a) * 0.62;
      o.c[k] += o.v[k];
    }
    const p = o.c;
    // parpadeo
    if (!sinParpadeo && t > blinkT[lado] && !blinking[lado]) { blinking[lado] = t; blinkT[lado] = t + 1200 + Math.random() * 3800; }
    let parp = 1;
    if (blinking[lado]) { const f = (t - blinking[lado]) / 110; parp = f < 1 ? Math.max(0.02, Math.abs(1 - 2 * f)) : 1; if (f >= 1) blinking[lado] = 0; }
    // temblor + pulso de voz (los ojos laten con cada sílaba, como en el rig)
    const tx = (Math.random() - 0.5) * p.trem, ty = (Math.random() - 0.5) * p.trem;
    const pulso = transient * 0.55 + vol * 0.12;
    E[lado].style.clipPath = recorte(lado, p);
    const w = W[lado].style;
    w.setProperty('--eye-sx', (p.sx + pulso).toFixed(3));
    w.setProperty('--eye-sy', ((p.sy + pulso) * parp).toFixed(3));
    w.setProperty('--eye-x', `${tx.toFixed(2)}px`); w.setProperty('--eye-y', `${ty.toFixed(2)}px`);
    w.setProperty('--eye-glow', glow);
    E[lado].style.setProperty('--hl-s', Math.max(0, p.hl).toFixed(3));
    E[lado].style.setProperty('--hl-o', p.hl < 0.05 ? 0 : 1);
    E[lado].style.setProperty('--hl-x', `${p.hlx.toFixed(2)}px`); E[lado].style.setProperty('--hl-y', `${p.hly.toFixed(2)}px`);
    // la ceja: el giro se espeja en el ojo derecho para que «interior» sea siempre hacia la nariz
    const C = document.getElementById(lado === 'L' ? 'ceja-left' : 'ceja-right').style;
    C.setProperty('--ceja-y', `${p.bY.toFixed(2)}px`); C.setProperty('--ceja-r', `${(lado === 'L' ? p.bR : -p.bR).toFixed(2)}deg`);
    C.setProperty('--ceja-o', Math.max(0, Math.min(1, p.bO)).toFixed(3));
  }
  requestAnimationFrame(frame);
}

function setPose(nombre) {
  pose = nombre; rigidez = POSES[nombre].k; glowObj = POSES[nombre].glow;
  document.getElementById('nombre').textContent = NOMBRES[nombre];
  document.querySelectorAll('#panel button[data-pose]').forEach(b => b.classList.toggle('on', b.dataset.pose === nombre));
}

// ── Panel ──
const panel = document.getElementById('panel');
for (const n of ORDEN) { const b = document.createElement('button'); b.dataset.pose = n; b.textContent = n; b.onclick = () => { auto = false; document.getElementById('b-auto').classList.remove('on'); setPose(n); }; panel.appendChild(b); }
const sep = document.createElement('span'); sep.className = 'sep'; panel.appendChild(sep);
const bh = document.createElement('button'); bh.textContent = 'hablar'; bh.onclick = () => { hablando = !hablando; bh.classList.toggle('on', hablando); }; panel.appendChild(bh);
const ba = document.createElement('button'); ba.id = 'b-auto'; ba.textContent = 'auto'; ba.onclick = () => { auto = !auto; ba.classList.toggle('on', auto); autoT = 0; }; panel.appendChild(ba);
const bs = document.createElement('button'); bs.textContent = 'susto'; bs.onclick = () => { const prev = pose; setPose('miedo'); setTimeout(() => setPose(prev), 700); }; panel.appendChild(bs);
const sep2 = document.createElement('span'); sep2.className = 'sep'; panel.appendChild(sep2);
for (const g of ['orgullo', 'escucha']) { const b = document.createElement('button'); b.textContent = g === 'orgullo' ? 'doble ceja' : 'escucha'; b.onclick = () => gesto(g); panel.appendChild(b); }
document.addEventListener('keydown', (e) => { const i = parseInt(e.key, 10); if (i >= 1 && i <= 8) setPose(ORDEN[i - 1]); if (e.key === ' ') { e.preventDefault(); bh.click(); } });

// Zoom automático: los dos ojos (320px de rig) caben siempre, hasta ×4.
function ajustarZoom() { const z = Math.max(1.5, Math.min(4, (window.innerWidth - 40) / 360, (window.innerHeight - 220) / 170)); document.getElementById('rig').style.setProperty('--zoom', z.toFixed(2)); document.querySelector('#zoom input').value = z.toFixed(1); }
window.addEventListener('resize', ajustarZoom); ajustarZoom();
setPose('neutro');
requestAnimationFrame(frame);
</script>
</body>
</html>
