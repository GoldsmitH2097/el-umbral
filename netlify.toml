[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

# AQUÍ NO HAY CATCH-ALL, Y ES A PROPÓSITO. Vivió uno ("/*" -> /index.html 200)
# desde el primer commit: el soft-200 que sirvió la home con canonical "/" para
# CUALQUIER URL inexistente y llenó Google de duplicados fantasma imposibles de
# validar (CLAUDE.md: "FIXED July 27, 2026 — do not regress"). El fix de julio
# lo sustituyó en public/_redirects ("/*" -> /404.html 404) pero olvidó borrar
# este bloque, que quedó muerto solo por precedencia (_redirects se procesa
# antes que netlify.toml): si _redirects se vaciara o dejara de copiarse a
# dist, el soft-200 renacía en silencio, sin error de build. Las redirecciones
# viven ÚNICAMENTE en public/_redirects — no añadas reglas de redirect aquí.

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # microphone=(self): Tizno habla con el visitante (opcional, solo al pulsar
    # el candado y tocar a Tizno — ver el pacto de privacidad en el footer).
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# Videos & unversioned assets: these filenames do NOT carry a content hash,
# so "immutable" was a lie — replacing a video or cover under the same name
# left visitors watching the stale copy for up to 30 days (real risk: covers
# were swapped twice this week). 7 days, no immutable: browsers revalidate
# with an ETag (a cheap 304) after a week. If an asset must change NOW,
# rename it — StateManager is the single reference point.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS/CSS bundles (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
