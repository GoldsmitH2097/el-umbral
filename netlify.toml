[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # microphone=(self): Tizno habla con el visitante (opcional, solo al pulsar
    # el pendiente). Preparado ANTES del merge de PR #63 para que el lanzamiento
    # no dependa de tocar este archivo. Un self-origin sin código que pida micro
    # es inerte: nada en producción lo solicita hasta que Tizno llegue a main.
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# Videos & unversioned assets: these filenames do NOT carry a content hash,
# so "immutable" was a lie — replacing a video or cover under the same name
# left visitors watching the stale copy for up to 30 days (real risk: covers
# were swapped twice this week). 7 days, no immutable: browsers revalidate
# with an ETag (a cheap 304) after a week. If an asset must change NOW,
# rename it — StateManager is the single reference point.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS/CSS bundles (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
