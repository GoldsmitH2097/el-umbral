[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

# Funciones serverless (la primera: netlify/functions/stripe-webhook.mjs, el
# webhook de Stripe). API 2.0 (.mjs, export default), empaquetadas con esbuild.
# Las claves viven en Site configuration → Environment variables, nunca aquí.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# AQUÍ NO HAY CATCH-ALL, Y ES A PROPÓSITO. Vivió uno ("/*" -> /index.html 200)
# desde el primer commit: el soft-200 que sirvió la home con canonical "/" para
# CUALQUIER URL inexistente y llenó Google de duplicados fantasma imposibles de
# validar (CLAUDE.md: "FIXED July 27, 2026 — do not regress"). El fix de julio
# lo sustituyó en public/_redirects ("/*" -> /404.html 404) pero olvidó borrar
# este bloque, que quedó muerto solo por precedencia (_redirects se procesa
# antes que netlify.toml): si _redirects se vaciara o dejara de copiarse a
# dist, el soft-200 renacía en silencio, sin error de build. Las redirecciones
# viven ÚNICAMENTE en public/_redirects — no añadas reglas de redirect aquí.

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # microphone=(self): Tizno habla con el visitante (opcional, solo al pulsar
    # el candado y tocar a Tizno — ver el pacto de privacidad en el footer).
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# Videos & unversioned assets: these filenames do NOT carry a content hash,
# so "immutable" was a lie — replacing a video or cover under the same name
# left visitors watching the stale copy for up to 30 days (real risk: covers
# were swapped twice this week). 7 days, no immutable: browsers revalidate
# with an ETag (a cheap 304) after a week. If an asset must change NOW,
# rename it — StateManager is the single reference point.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS/CSS bundles (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La fuente de las señales de Tizno no cambia: caché de un año (si cambia, se renombra).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSP EN MODO INFORME para las páginas de Tizno (auditoría 11-sep-2026). No
# bloquea nada: solo avisa en la consola de lo que bloquearía. Una semana en
# informe, revisar la consola en una llamada real (ES, EN y embed) y, si está
# limpia, cambiar la cabecera a Content-Security-Policy. jsDelivr está porque
# el SDK de ElevenLabs carga de ahí un remuestreador en navegadores sin
# soporte de sampleRate; blob: por su AudioWorklet.
[[headers]]
  for = "/tizno"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://esm.sh https://cdn.jsdelivr.net https://api.elevenlabs.io wss://api.elevenlabs.io https://api.us.elevenlabs.io wss://api.us.elevenlabs.io; worker-src 'self' blob:"

